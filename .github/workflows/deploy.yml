name: Deploy Astro to GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/**'
      - 'scripts/**'
      - 'src/**'
      - 'source/**'
      - 'public/**'
      - 'astro.config.*'
      - 'package.json'
      - 'pnpm-lock.yaml'
  workflow_dispatch:
    inputs:
      probe_summaries:
        description: 'Only verify the AI summary API (3 posts, writes no cache)'
        type: boolean
        default: false

jobs:
  probe:
    # 手动触发并勾选 probe_summaries 时，只验证 LLM 凭据，不做部署。
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.probe_summaries }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies (pnpm lockfile)
        run: pnpm install --frozen-lockfile

      - name: Probe AI summary API
        run: pnpm run probe:summaries
        env:
          OPENAI_API_BASE_URL: ${{ secrets.OPENAI_API_BASE_URL }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ secrets.OPENAI_MODEL }}

  deploy:
    # probe 模式下跳过部署，避免只做验证却触发一次发布。
    if: ${{ github.event_name != 'workflow_dispatch' || !inputs.probe_summaries }}
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies (pnpm lockfile)
        run: pnpm install --frozen-lockfile

      - name: Generate cache files
        run: |
          pnpm run generate:lqips
          pnpm run generate:summaries
          pnpm run generate:similarities
        env:
          OPENAI_API_BASE_URL: ${{ secrets.OPENAI_API_BASE_URL }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ secrets.OPENAI_MODEL }}

      - name: Commit cache updates
        env:
          HUSKY: 0
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add src/cache/
          if git diff --staged --quiet; then
            echo "No cache changes to commit"
          else
            # FIXED: Skip local Husky hooks for bot-generated CI commits.
            git commit -m "chore: update cache files [skip ci]"
            git push
          fi

      - name: Build site
        run: pnpm run build:ci

      - name: Deploy to external GitHub Pages repo
        uses: peaceiris/actions-gh-pages@v3
        with:
          personal_token: ${{ secrets.DEPLOY_TOKEN }}
          external_repository: slowbyte-run/slowbyte-run.github.io
          publish_branch: main
          publish_dir: ./dist
          user_name: 'github-actions[bot]'
          user_email: 'github-actions[bot]@users.noreply.github.com'
          commit_message: ${{ github.event.head_commit.message }}
